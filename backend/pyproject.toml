[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "t06-plando-see-api"
version = "0.1.0"
description = "Flask API for the T06 Plan-Do-See diary"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "waitress>=3,<4",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "jsonschema[format]>=4.23,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

